name: CI Backend

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Build + Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Chequeo de sintaxis (compileall)
        run: python -m compileall src

      - name: Smoke test — la app arranca, /health y guardia JWT (sin servicios externos)
        env:
          EXIGIR_JWT: "true"
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from src.main import app

          cliente = TestClient(app)
          r = cliente.get("/health")
          assert r.status_code == 200, r.text
          assert r.json()["status"] == "healthy", r.text
          print("OK /health ->", r.json()["status"])

          # Con EXIGIR_JWT=true y sin token, un endpoint protegido responde 401
          # ANTES de tocar la base de datos: verifica la guardia sin red.
          r2 = cliente.get("/api/v1/catalog/")
          assert r2.status_code == 401, f"esperado 401 sin token, dio {r2.status_code}: {r2.text}"
          print("OK guardia JWT sin token -> 401")
          PY

      - name: Chequeo de seguridad — el .env no debe estar en el repo
        shell: bash
        run: |
          if [ -f .env ]; then
            echo "ERROR: .env está commiteado (contiene secretos)"
            exit 1
          fi
          echo "OK: no hay .env en el repo"
